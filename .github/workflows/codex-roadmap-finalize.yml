name: Codex Roadmap Finalize

on:
  pull_request:
    branches: [ main ]
    types: [ opened, reopened, synchronize ]

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/finish-data-cyc-ai-golden-gates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply remaining roadmap patches
        run: node scripts/.codex-finalize-roadmap.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Focused regression tests
        run: npx vitest run -c vitest.unit.config.ts tests/unit/shared/time/brazilCalendar.test.ts tests/unit/shared/contracts/lead-openapi-contract.test.ts src/features/intelligence/evaluation/__tests__/goldenDataset.scoring.test.ts src/features/intelligence/evaluation/__tests__/goldenDataset.service.test.ts

      - name: Production build
        run: npm run build

      - name: Remove temporary finalizer files
        run: rm -f scripts/.codex-finalize-roadmap.mjs .github/workflows/codex-roadmap-finalize.yml scripts/.codex-trigger

      - name: Commit validated closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/features/commercial-intelligence/application/CommercialIntelligenceUseCases.ts \
            docs/openapi.yaml \
            src/features/intelligence/evaluation/goldenDataset.types.ts \
            .github/workflows/ci.yml \
            docs/DATA-CONTRACT-LEAD.md \
            docs/AI-SWARM-GOVERNANCE-AUDIT.md \
            docs/CADENCE-CYCLE-AUDIT.md \
            .agents/runs/onda-37.md
          git rm --ignore-unmatch -- \
            scripts/.codex-finalize-roadmap.mjs \
            .github/workflows/codex-roadmap-finalize.yml \
            scripts/.codex-trigger
          git diff --cached --check
          git status --short
          git commit -m "feat: close DATA-006/007/008 and Golden Dataset evaluation gates"
          git push origin HEAD:${{ github.head_ref }}

      - name: Dispatch official CI for final SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          payload=$(jq -n --arg ref "$HEAD_REF" '{ref:$ref}')
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/ci.yml/dispatches" \
            -d "$payload"
