name: Codex Roadmap Finalize

on:
  pull_request:
    branches: [ main ]
    types: [ reopened ]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/finish-data-cyc-ai-golden-gates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Merge current main without committing yet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply remaining roadmap patches
        run: node scripts/.codex-finalize-roadmap.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Focused regression tests
        run: npx vitest run -c vitest.unit.config.ts tests/unit/shared/time/brazilCalendar.test.ts tests/unit/shared/contracts/lead-openapi-contract.test.ts src/features/intelligence/evaluation/__tests__/goldenDataset.scoring.test.ts src/features/intelligence/evaluation/__tests__/goldenDataset.service.test.ts

      - name: Production build
        run: npm run build

      - name: Commit validated closure merged with current main
        run: |
          git add -- \
            src/features/commercial-intelligence/application/CommercialIntelligenceUseCases.ts \
            docs/openapi.yaml \
            src/features/intelligence/evaluation/goldenDataset.types.ts \
            docs/DATA-CONTRACT-LEAD.md \
            docs/AI-SWARM-GOVERNANCE-AUDIT.md \
            docs/CADENCE-CYCLE-AUDIT.md \
            .agents/runs/onda-37.md \
            src/components/layout/Sidebar.tsx \
            scripts/deploy-oci.sh
          git diff --cached --check
          git status --short
          git commit -m "feat: close data and AI evaluation roadmap gates"
          git push origin HEAD:${{ github.head_ref }}
