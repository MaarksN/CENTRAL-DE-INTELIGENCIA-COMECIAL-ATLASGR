name: Codex Roadmap Finalize

on:
  push:
    branches: [ codex/finish-data-cyc-ai-golden-gates ]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply roadmap patches
        run: node scripts/.codex-finalize-roadmap.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Focused regression tests
        run: npx vitest run -c vitest.unit.config.ts tests/unit/shared/time/brazilCalendar.test.ts tests/unit/shared/contracts/lead-openapi-contract.test.ts src/features/intelligence/evaluation/__tests__/goldenDataset.scoring.test.ts src/features/intelligence/evaluation/__tests__/goldenDataset.service.test.ts

      - name: Production build
        run: npm run build

      - name: Remove temporary finalizer
        run: rm -f scripts/.codex-finalize-roadmap.mjs .github/workflows/codex-roadmap-finalize.yml

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: close DATA-006/007/008 and Golden Dataset evaluation gates"
          git push origin HEAD:codex/finish-data-cyc-ai-golden-gates
