version: '3.8'

services:
  app:
    build:
      context: .
      target: runner
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://prospector:prospector_pass@postgres-primary:5432/prospectordb?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_jwt
      # - GEMINI_API_KEY=your_key_here
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prospector-net

  postgres-primary:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=prospector
      - POSTGRES_PASSWORD=prospector_pass
      - POSTGRES_DB=prospectordb
    ports:
      - "5434:5432"
    volumes:
      - pgdata-primary:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospector -d prospectordb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prospector-net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prospector-net

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - prospector-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - prospector-net

volumes:
  pgdata-primary:
  redisdata:

networks:
  prospector-net:
    driver: bridge
